<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="하루를 스치는 마음의 조각 — 짧게 붙잡아 두는 여덟 편의 시.">
<meta name="theme-color" content="#eef1f3">
<title>짧은 시 · U-SOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f3;
    --bg2: #e4e9ee;
    --ink: #232830;
    --soft: #4c545e;
    --muted: #808892;
    --line: #d7dde3;
    --card: #fbfcfd;
    --accent: #486b8a;
    --accent-soft: #d9e3ec;
    --shadow: 0 1px 2px rgba(30,40,55,0.03), 0 8px 24px rgba(30,40,55,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 15% -10%, #f5f8fb 0%, transparent 55%),
      radial-gradient(ellipse at 90% 100%, #dde5ec 0%, transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color: var(--ink);
    font-family: 'Gowun Batang', 'Noto Serif KR', serif;
    -webkit-font-smoothing: antialiased;
  }
  .back {
    position: fixed; top: 18px; left: 20px;
    color: var(--muted); text-decoration: none;
    font-family: 'Spline Sans', system-ui, sans-serif;
    font-size: 13.5px; letter-spacing: .04em; z-index: 5;
  }
  .back:hover { color: var(--accent); }

  .wrap {
    max-width: 640px; margin: 0 auto;
    padding: 76px 22px 72px;
  }

  header { text-align: center; margin-bottom: 44px; }
  .date {
    font-family: 'Spline Sans', system-ui, sans-serif;
    font-size: 13px; color: var(--muted); letter-spacing: .12em; margin-bottom: 10px;
  }
  .eyebrow {
    font-family: 'Gowun Batang', serif;
    font-size: 14.5px; color: var(--accent);
    letter-spacing: .32em; margin-bottom: 22px;
  }
  .eyebrow::after {
    content: ""; display: block; width: 34px; height: 1px;
    background: var(--accent); margin: 14px auto 0; opacity: .55;
  }
  h1 {
    font-family: 'Gowun Batang', serif;
    font-size: clamp(26px, 5.4vw, 34px); font-weight: 700;
    letter-spacing: -0.01em; line-height: 1.3; margin-bottom: 10px;
  }
  .lede {
    font-family: 'Fraunces', serif; font-style: italic;
    font-size: 14.5px; color: var(--soft); line-height: 1.65;
  }

  .list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 36px; }
  .pick {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 18px; cursor: pointer;
    text-align: left; width: 100%; box-shadow: var(--shadow);
    transition: transform .15s, border-color .15s;
    font-family: 'Gowun Batang', serif;
  }
  .pick:hover { transform: translateY(-2px); border-color: var(--accent); }
  .pick.on { border-color: var(--accent); background: var(--accent-soft); }
  .pick .no {
    font-family: 'Spline Sans', system-ui, sans-serif;
    font-size: 11px; color: var(--accent); letter-spacing: .3em;
    margin-bottom: 5px;
  }
  .pick .tt { font-size: 17px; font-weight: 700; color: var(--ink); }

  article {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 40px 30px 32px;
    box-shadow: var(--shadow);
    animation: fade .5s ease;
    text-align: center;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  article .num {
    font-family: 'Spline Sans', system-ui, sans-serif;
    font-size: 11.5px; color: var(--accent); letter-spacing: .32em; margin-bottom: 14px;
  }
  article h2 {
    font-family: 'Gowun Batang', serif; font-size: 22px; font-weight: 700;
    line-height: 1.35; margin-bottom: 26px;
    padding-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  article .body {
    font-family: 'Gowun Batang', serif; font-size: 17px; color: var(--ink);
    line-height: 2.15; word-break: keep-all;
  }
  article .body .line { display: block; }
  article .body .stanza { margin-bottom: 1.3em; }
  article .body .stanza:last-child { margin-bottom: 0; }

  .navrow {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 28px;
  }
  .navrow button {
    flex: 1; padding: 12px;
    font-family: 'Spline Sans', system-ui, sans-serif;
    font-size: 13px; color: var(--soft);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    cursor: pointer; transition: all .15s;
  }
  .navrow button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .navrow button:disabled { opacity: .35; cursor: default; }

  footer {
    text-align: center; margin-top: 56px;
    font-family: 'Spline Sans', system-ui, sans-serif;
    font-size: 11.5px; color: var(--muted);
  }
</style>
</head>
<body>
<a class="back" href="/">← U-SOL</a>
<div class="wrap">
  <header>
    <div class="date" id="date">…</div>
    <div class="eyebrow">SHORT POEM</div>
    <h1>짧은 시</h1>
    <p class="lede">하루를 스치는 마음의 조각을 짧게 붙잡아 두는 여덟 편.</p>
  </header>

  <div class="list" id="list"></div>
  <div id="read"></div>

  <footer>© U-SOL · 짧은 시</footer>
</div>

<script>
  const poems = [
    {
      no: "01",
      title: "새벽",
      body: [
        ["아직 아무도 없는 시간", "창밖은 조용히 밝아지고"],
        ["나는 이 고요를", "누구에게도 나눠 주고 싶지 않다"]
      ]
    },
    {
      no: "02",
      title: "지하철 창가",
      body: [
        ["익숙한 얼굴들이", "유리에 비쳐 흘러간다"],
        ["누구도 오래 보지 않지만", "모두가 한 번쯤 바라본 창"]
      ]
    },
    {
      no: "03",
      title: "여백",
      body: [
        ["말하지 않은 것들이", "말한 것보다 많은 날"],
        ["빈 자리가", "가장 큰 답이 된다"]
      ]
    },
    {
      no: "04",
      title: "조용한 사람",
      body: [
        ["그 사람이 방에 들어오면", "소리가 조금씩 낮아졌다"],
        ["말이 없어도 자리는 있고", "자리에 있는 것만으로 충분한 사람"]
      ]
    },
    {
      no: "05",
      title: "반복",
      body: [
        ["같은 커피 같은 자리", "같은 뉴스 같은 창밖"],
        ["어제와 오늘 사이", "아주 작은 차이 하나가", "오늘을 오늘이게 한다"]
      ]
    },
    {
      no: "06",
      title: "마음의 자리",
      body: [
        ["마음에는 자리가 있어", "사람이 앉기도 하고", "계절이 머물기도 한다"],
        ["한번 자리를 잡은 이는", "쉽게 일어나지 않는다"]
      ]
    },
    {
      no: "07",
      title: "저녁",
      body: [
        ["불을 켜지 않고", "잠시 앉아 있는다"],
        ["어둠이 방을 정리하고", "남은 하루가", "조용히 잘 자리를 편다"]
      ]
    },
    {
      no: "08",
      title: "손끝",
      body: [
        ["키보드 위의 손끝에", "오늘 하루가 다 들어 있다"],
        ["쓰지 못한 문장", "못 보낸 메시지", "그리고 곧 눌리게 될 어떤 답"]
      ]
    }
  ];

  const $list = document.getElementById('list');
  const $read = document.getElementById('read');
  const $date = document.getElementById('date');

  const now = new Date();
  $date.textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  function renderList(active) {
    $list.innerHTML = poems.map((p, i) => `
      <button class="pick ${i === active ? 'on' : ''}" data-i="${i}">
        <div class="no">POEM ${p.no}</div>
        <div class="tt">${p.title}</div>
      </button>
    `).join('');
    $list.querySelectorAll('.pick').forEach(btn => {
      btn.addEventListener('click', () => open(parseInt(btn.dataset.i, 10)));
    });
  }

  function open(i) {
    const p = poems[i];
    renderList(i);
    const stanzas = p.body.map(st =>
      `<div class="stanza">${st.map(l => `<span class="line">${l}</span>`).join('')}</div>`
    ).join('');
    $read.innerHTML = `
      <article>
        <div class="num">POEM ${p.no}</div>
        <h2>${p.title}</h2>
        <div class="body">${stanzas}</div>
        <div class="navrow">
          <button id="prev" ${i === 0 ? 'disabled' : ''}>← 이전</button>
          <button id="next" ${i === poems.length - 1 ? 'disabled' : ''}>다음 →</button>
        </div>
      </article>
    `;
    document.getElementById('prev').addEventListener('click', () => { if (i > 0) { open(i - 1); scrollToRead(); } });
    document.getElementById('next').addEventListener('click', () => { if (i < poems.length - 1) { open(i + 1); scrollToRead(); } });
    scrollToRead();
  }

  function scrollToRead() {
    $read.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  renderList(-1);
</script>
</body>
</html>
