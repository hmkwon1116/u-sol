<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="네온 아케이드 스타일 카드 짝맞추기. 처음에 잠깐 보고 기억한 뒤 짝을 맞추는 메모리 게임.">
<meta name="theme-color" content="#0a0a12">
<title>NEON MEMORY · 네온 카드매치</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700;900&display=swap');

  :root {
    --bg: #0a0a12;
    --panel: #12121f;
    --accent: #3dff7a;
    --accent-2: #ff2d95;
    --accent-3: #4dd6ff;
    --text: #e8ecff;
    --muted: #7a82b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    min-height: 100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(61,255,122,0.14), transparent 55%),
      radial-gradient(ellipse at 80% 120%, rgba(255,45,149,0.12), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    user-select: none;
  }

  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: multiply;
  }

  .back-link {
    position: fixed; top: 14px; left: 16px; z-index: 200;
    color: var(--muted); text-decoration: none;
    font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px;
  }

  .wrap {
    max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 56px 12px 40px;
  }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4vw, 22px);
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.6;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(61,255,122,0.35);
  }

  .stats-row {
    display: flex; gap: 8px;
    width: 100%; max-width: 460px;
    justify-content: space-between;
  }

  .card-stat {
    background: var(--panel);
    border: 1px solid rgba(120,130,200,0.18);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: inset 0 0 16px rgba(0,0,0,0.4);
    flex: 1;
    text-align: center;
    min-width: 0;
  }
  .card-stat h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(61,255,122,0.5);
  }
  .card-stat.pink .stat-value { color: var(--accent-2); text-shadow: 0 0 12px rgba(255,45,149,0.5); }
  .card-stat.blue .stat-value { color: var(--accent-3); text-shadow: 0 0 12px rgba(77,214,255,0.5); }

  .difficulty {
    display: flex; gap: 6px;
    padding: 4px;
    background: var(--panel);
    border: 1px solid rgba(120,130,200,0.18);
    border-radius: 10px;
  }
  .difficulty button {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    padding: 8px 12px;
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background .1s, color .1s;
  }
  .difficulty button.active {
    background: rgba(61,255,122,0.15);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(61,255,122,0.25);
  }

  .board-frame {
    position: relative;
    padding: 8px;
    border-radius: 14px;
    background: linear-gradient(145deg, rgba(61,255,122,0.5), rgba(255,45,149,0.5));
    box-shadow: 0 0 40px rgba(61,255,122,0.22), inset 0 0 20px rgba(0,0,0,0.6);
  }

  .board {
    display: grid;
    gap: 6px;
    background: var(--panel);
    padding: 8px;
    border-radius: 8px;
  }

  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
    position: relative;
  }
  .card-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.4,1.4,.5,1);
  }
  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(22px, 6vw, 34px);
  }
  .card-back {
    background: linear-gradient(145deg, #1a1a2e, #0f0f1c);
    border: 1px solid rgba(77,214,255,0.35);
    box-shadow: inset 0 0 12px rgba(77,214,255,0.15), 0 0 8px rgba(77,214,255,0.15);
    color: var(--accent-3);
    text-shadow: 0 0 10px rgba(77,214,255,0.6);
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(12px, 3vw, 18px);
  }
  .card-front {
    background: linear-gradient(145deg, #12122a, #1a1a35);
    border: 1px solid rgba(61,255,122,0.35);
    transform: rotateY(180deg);
    box-shadow: inset 0 0 12px rgba(61,255,122,0.15);
    text-shadow: 0 0 12px rgba(61,255,122,0.35);
  }
  .card.matched .card-front {
    border-color: rgba(255,45,149,0.6);
    box-shadow: inset 0 0 14px rgba(255,45,149,0.25), 0 0 14px rgba(255,45,149,0.35);
    animation: matched-pulse .5s ease-out;
  }
  .card.wrong .card-front {
    border-color: rgba(255,80,80,0.7);
    box-shadow: inset 0 0 14px rgba(255,80,80,0.3), 0 0 14px rgba(255,80,80,0.4);
    animation: shake .35s;
  }
  @keyframes matched-pulse {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.08); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  @keyframes shake {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-4px); }
    75% { transform: rotateY(180deg) translateX(4px); }
  }

  .card.locked { pointer-events: none; }

  .controls {
    display: flex; gap: 8px;
    margin-top: 4px;
  }
  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #061015;
    background: linear-gradient(90deg, var(--accent), #b6ffcf);
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(61,255,122,0.5);
    transition: transform .06s;
  }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    box-shadow: none;
    border: 1px solid rgba(120,130,200,0.3);
  }
  .btn:active { transform: scale(0.96); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: rgba(10,10,18,0.9);
    backdrop-filter: blur(4px);
    border-radius: 8px;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay .big {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    line-height: 1.8;
    color: var(--accent-2);
    text-shadow: 0 0 18px rgba(255,45,149,0.5);
  }
  .overlay .sub { font-size: 13px; color: var(--muted); line-height: 1.8; }

  .memo-badge {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--accent-3);
    background: rgba(10,10,18,0.75);
    border: 1px solid rgba(77,214,255,0.35);
    padding: 8px 14px;
    border-radius: 20px;
    letter-spacing: 1px;
    z-index: 20;
    text-shadow: 0 0 12px rgba(77,214,255,0.55);
    pointer-events: none;
  }
  .memo-badge.hidden { display: none; }

  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
    letter-spacing: .5px;
  }
</style>
</head>
<body>
<a class="back-link" href="/game/">← 게임</a>

<div class="wrap">
  <div class="title">NEON MEMORY</div>

  <div class="stats-row">
    <div class="card-stat"><h2>Moves</h2><div class="stat-value" id="moves">0</div></div>
    <div class="card-stat pink"><h2>Pairs</h2><div class="stat-value" id="pairs">0/0</div></div>
    <div class="card-stat blue"><h2>Time</h2><div class="stat-value" id="time">0.0s</div></div>
  </div>

  <div class="difficulty" id="diff">
    <button data-cols="3" data-rows="4" class="active">EASY 3×4</button>
    <button data-cols="4" data-rows="4">MID 4×4</button>
    <button data-cols="4" data-rows="5">HARD 4×5</button>
  </div>

  <div class="board-frame">
    <div class="memo-badge hidden" id="memoBadge">기억하세요 · <span id="memoSec">5</span></div>
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <div class="big" id="ov-title">READY?</div>
      <div class="sub" id="ov-sub">카드를 잠깐 보여드릴게요<br>기억한 뒤 짝을 맞추세요</div>
      <button class="btn" id="startBtn">START</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn ghost" id="restartBtn">RESTART</button>
  </div>

  <div class="hint">
    카드를 클릭 · 같은 그림 두 장이면 성공 · 최소 이동으로 클리어
  </div>
</div>

<script>
(function () {
  const EMOJIS = ['🍕','🍔','🍣','🍩','🍎','🍇','🍓','🍑','🥑','🌮','🍜','🍺','🎸','🎧','🎨','🎲','🚀','⚽','🎁','🌈'];

  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const timeEl = document.getElementById('time');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovSub = document.getElementById('ov-sub');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const memoBadge = document.getElementById('memoBadge');
  const memoSec = document.getElementById('memoSec');
  const diffEl = document.getElementById('diff');

  let cols = 3, rows = 4;
  let cards = [];
  let first = null, second = null;
  let lock = false;
  let matched = 0, moves = 0, totalPairs = 0;
  let startTs = 0, timerId = null, elapsed = 0;
  let memoTimer = null;
  let running = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildBoard() {
    const total = cols * rows;
    totalPairs = total / 2;
    const pool = shuffle(EMOJIS.slice()).slice(0, totalPairs);
    const deck = shuffle([...pool, ...pool]);

    boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    // sizing: base cell target so full board fits mobile viewport
    const vw = Math.min(window.innerWidth - 40, 460);
    const targetW = vw - 16; // minus board padding
    const cell = Math.floor((targetW - (cols - 1) * 6) / cols);
    boardEl.style.width = (cell * cols + (cols - 1) * 6 + 16) + 'px';

    boardEl.innerHTML = '';
    cards = deck.map((emoji, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.dataset.index = i;
      el.dataset.emoji = emoji;
      el.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-back">?</div>
          <div class="card-face card-front">${emoji}</div>
        </div>`;
      el.addEventListener('click', () => onCardClick(el));
      boardEl.appendChild(el);
      return el;
    });

    matched = 0; moves = 0;
    first = null; second = null; lock = true; // locked during memo
    updateStats();
  }

  function updateStats() {
    movesEl.textContent = moves;
    pairsEl.textContent = matched + '/' + totalPairs;
  }

  function showAll() {
    cards.forEach(c => c.classList.add('flipped'));
  }
  function hideAll() {
    cards.forEach(c => {
      if (!c.classList.contains('matched')) c.classList.remove('flipped');
    });
  }

  function onCardClick(el) {
    if (lock) return;
    if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
    el.classList.add('flipped');
    if (!first) { first = el; return; }
    if (el === first) return;
    second = el;
    moves++;
    updateStats();

    if (first.dataset.emoji === second.dataset.emoji) {
      const a = first, b = second;
      first = null; second = null;
      setTimeout(() => {
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        updateStats();
        if (matched === totalPairs) win();
      }, 250);
    } else {
      lock = true;
      const a = first, b = second;
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(() => {
        a.classList.remove('flipped', 'wrong');
        b.classList.remove('flipped', 'wrong');
        first = null; second = null;
        lock = false;
      }, 750);
    }
  }

  function startTimer() {
    startTs = performance.now();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(() => {
      elapsed = (performance.now() - startTs) / 1000;
      timeEl.textContent = elapsed.toFixed(1) + 's';
    }, 100);
  }
  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function memorize(seconds, done) {
    memoBadge.classList.remove('hidden');
    let remaining = seconds;
    memoSec.textContent = remaining;
    showAll();
    if (memoTimer) clearInterval(memoTimer);
    memoTimer = setInterval(() => {
      remaining--;
      memoSec.textContent = remaining;
      if (remaining <= 0) {
        clearInterval(memoTimer);
        memoTimer = null;
        memoBadge.classList.add('hidden');
        hideAll();
        done();
      }
    }, 1000);
  }

  function startGame() {
    overlay.classList.add('hidden');
    buildBoard();
    running = true;
    lock = true;
    const secs = totalPairs <= 6 ? 4 : totalPairs <= 8 ? 5 : 6;
    memorize(secs, () => {
      lock = false;
      startTimer();
    });
  }

  function win() {
    stopTimer();
    running = false;
    ovTitle.textContent = 'CLEAR!';
    ovSub.innerHTML = `⏱ ${elapsed.toFixed(1)}초 · 🎯 ${moves}회<br>정말 잘하셨어요`;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.classList.remove('hidden');
  }

  function restart() {
    stopTimer();
    if (memoTimer) { clearInterval(memoTimer); memoTimer = null; }
    memoBadge.classList.add('hidden');
    elapsed = 0; timeEl.textContent = '0.0s';
    startGame();
  }

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', restart);

  diffEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    diffEl.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cols = parseInt(btn.dataset.cols, 10);
    rows = parseInt(btn.dataset.rows, 10);
    stopTimer();
    if (memoTimer) { clearInterval(memoTimer); memoTimer = null; }
    memoBadge.classList.add('hidden');
    elapsed = 0; timeEl.textContent = '0.0s';
    ovTitle.textContent = 'READY?';
    ovSub.innerHTML = '카드를 잠깐 보여드릴게요<br>기억한 뒤 짝을 맞추세요';
    startBtn.textContent = 'START';
    overlay.classList.remove('hidden');
    buildBoard();
  });

  // initial preview
  buildBoard();

  window.addEventListener('resize', () => {
    // just re-lay-out sizes without rebuilding state
    const vw = Math.min(window.innerWidth - 40, 460);
    const targetW = vw - 16;
    const cell = Math.floor((targetW - (cols - 1) * 6) / cols);
    boardEl.style.width = (cell * cols + (cols - 1) * 6 + 16) + 'px';
  });
})();
</script>
</body>
</html>
