<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="네온 아케이드 스타일 스네이크. 키보드·스와이프로 즐기는 한국어 웹 스네이크 게임.">
<meta name="theme-color" content="#0a0a12">
<title>NEON SNAKE · 네온 스네이크</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700;900&display=swap');

  :root {
    --bg: #0a0a12;
    --panel: #12121f;
    --grid-line: rgba(120,130,200,0.08);
    --accent: #3dff7a;
    --accent-2: #ff2d95;
    --text: #e8ecff;
    --muted: #7a82b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(61,255,122,0.14), transparent 55%),
      radial-gradient(ellipse at 80% 120%, rgba(255,45,149,0.12), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 100;
    mix-blend-mode: multiply;
  }

  .wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 12px;
  }

  .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(14px, 4vw, 24px);
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.6;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 24px rgba(61,255,122,0.35);
  }

  .stats-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 420px;
    justify-content: space-between;
  }

  .card {
    background: var(--panel);
    border: 1px solid rgba(120,130,200,0.18);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: inset 0 0 16px rgba(0,0,0,0.4);
    flex: 1;
    text-align: center;
  }

  .card h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 22px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(61,255,122,0.5);
  }

  .board-frame {
    position: relative;
    padding: 6px;
    border-radius: 10px;
    background: linear-gradient(145deg, rgba(61,255,122,0.5), rgba(255,45,149,0.5));
    box-shadow: 0 0 40px rgba(61,255,122,0.22), inset 0 0 20px rgba(0,0,0,0.6);
  }

  canvas#board {
    display: block;
    background: var(--panel);
    border-radius: 6px;
    touch-action: none;
  }

  .touch {
    display: none;
    width: 100%;
    max-width: 240px;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .touch button {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid rgba(61,255,122,0.35);
    border-radius: 12px;
    padding: 14px 0;
    box-shadow: 0 0 14px rgba(61,255,122,0.12);
    transition: transform .05s, background .1s;
  }
  .touch button:active { transform: scale(0.94); background: rgba(61,255,122,0.15); }
  .touch .up { grid-column: 2; grid-row: 1; }
  .touch .left { grid-column: 1; grid-row: 2; }
  .touch .pause { grid-column: 2; grid-row: 2; font-size: 14px; }
  .touch .right { grid-column: 3; grid-row: 2; }
  .touch .down { grid-column: 2; grid-row: 3; }

  .controls-hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
    letter-spacing: .5px;
  }

  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    background: rgba(10,10,18,0.88);
    backdrop-filter: blur(4px);
    border-radius: 6px;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay .big {
    font-family: 'Press Start 2P', monospace;
    font-size: 16px;
    line-height: 1.8;
    color: var(--accent-2);
    text-shadow: 0 0 18px rgba(255,45,149,0.5);
  }
  .overlay .sub { font-size: 13px; color: var(--muted); line-height: 1.8; }
  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #061015;
    background: linear-gradient(90deg, var(--accent), #b6ffcf);
    border: none;
    border-radius: 8px;
    padding: 14px 22px;
    cursor: pointer;
    box-shadow: 0 0 22px rgba(61,255,122,0.5);
    transition: transform .06s;
  }
  .btn:active { transform: scale(0.96); }

  @media (max-width: 620px) {
    .touch { display: grid; }
    .controls-hint { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="/game/" style="position:fixed;top:14px;left:16px;z-index:200;color:#7a82b8;text-decoration:none;font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:1px;">← 게임</a>
  <div class="title">NEON SNAKE</div>

  <div class="stats-row">
    <div class="card"><h2>Score</h2><div class="stat-value" id="score">0</div></div>
    <div class="card"><h2>Best</h2><div class="stat-value" id="best">0</div></div>
    <div class="card"><h2>Length</h2><div class="stat-value" id="length">3</div></div>
  </div>

  <div class="board-frame">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ov-title">READY?</div>
      <div class="sub" id="ov-sub">먹이를 먹고 몸을 늘리세요<br>벽·자기 몸에 부딪히면 끝</div>
      <button class="btn" id="startBtn">START</button>
    </div>
  </div>

  <div class="touch" id="touch">
    <button class="up" data-act="up">▲</button>
    <button class="left" data-act="left">◀</button>
    <button class="pause" data-act="pause">⏸</button>
    <button class="right" data-act="right">▶</button>
    <button class="down" data-act="down">▼</button>
  </div>

  <div class="controls-hint">
    ← → ↑ ↓ 방향 &nbsp;·&nbsp; SPACE 일시정지 &nbsp;·&nbsp; ENTER 시작/재시작
  </div>
</div>

<script>
(function () {
  const COLS = 20, ROWS = 20;
  const board = document.getElementById('board');
  const ctx = board.getContext('2d');

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const lengthEl = document.getElementById('length');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovSub = document.getElementById('ov-sub');
  const startBtn = document.getElementById('startBtn');

  let CELL = 20;

  function sizeCanvas() {
    const vw = Math.min(window.innerWidth - 24, 420);
    const vh = window.innerHeight - 260;
    const target = Math.max(220, Math.min(vw, vh, 420));
    CELL = Math.floor(target / COLS);
    const dpr = window.devicePixelRatio || 1;
    board.style.width = (COLS * CELL) + 'px';
    board.style.height = (ROWS * CELL) + 'px';
    board.width = COLS * CELL * dpr;
    board.height = ROWS * CELL * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const STORAGE_KEY = 'neon-snake-best';
  let best = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, running, paused, over, tickInterval, tickTimer, raf, lastTime;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    score = 0;
    tickInterval = 140;
    placeFood();
    scoreEl.textContent = '0';
    lengthEl.textContent = snake.length;
  }

  function placeFood() {
    while (true) {
      const fx = (Math.random() * COLS) | 0;
      const fy = (Math.random() * ROWS) | 0;
      if (!snake.some(s => s.x === fx && s.y === fy)) {
        food = {x: fx, y: fy};
        return;
      }
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      lengthEl.textContent = snake.length;
      tickInterval = Math.max(60, tickInterval - 3);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function drawCellGlow(x, y, color, alpha) {
    const px = x * CELL, py = y * CELL;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha != null ? alpha : 1;
    ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
    const grad = ctx.createLinearGradient(px, py, px, py + CELL);
    grad.addColorStop(0, 'rgba(255,255,255,0.4)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = grad;
    ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.clearRect(0, 0, COLS * CELL, ROWS * CELL);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, ROWS * CELL); ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(COLS * CELL, y * CELL); ctx.stroke();
    }

    // food (pulsing pink)
    const pulse = 0.75 + 0.25 * Math.sin(performance.now() / 180);
    ctx.shadowBlur = 14;
    ctx.shadowColor = '#ff2d95';
    drawCellGlow(food.x, food.y, '#ff2d95', pulse);
    ctx.shadowBlur = 0;

    // snake
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const isHead = i === 0;
      ctx.shadowBlur = isHead ? 18 : 8;
      ctx.shadowColor = '#3dff7a';
      drawCellGlow(s.x, s.y, isHead ? '#b6ffcf' : '#3dff7a', 1);
    }
    ctx.shadowBlur = 0;

    // eyes on head
    if (snake.length) {
      const h = snake[0];
      const px = h.x * CELL, py = h.y * CELL;
      ctx.fillStyle = '#061015';
      const s = CELL / 8;
      let e1x, e1y, e2x, e2y;
      if (dir.x === 1) {
        e1x = px + CELL * 0.7; e1y = py + CELL * 0.28;
        e2x = px + CELL * 0.7; e2y = py + CELL * 0.62;
      } else if (dir.x === -1) {
        e1x = px + CELL * 0.2; e1y = py + CELL * 0.28;
        e2x = px + CELL * 0.2; e2y = py + CELL * 0.62;
      } else if (dir.y === -1) {
        e1x = px + CELL * 0.28; e1y = py + CELL * 0.2;
        e2x = px + CELL * 0.62; e2y = py + CELL * 0.2;
      } else {
        e1x = px + CELL * 0.28; e1y = py + CELL * 0.7;
        e2x = px + CELL * 0.62; e2y = py + CELL * 0.7;
      }
      ctx.fillRect(e1x, e1y, s, s);
      ctx.fillRect(e2x, e2y, s, s);
    }
  }

  function loop(t) {
    if (!running) return;
    raf = requestAnimationFrame(loop);
    if (paused || over) { render(); return; }
    const dt = t - lastTime;
    lastTime = t;
    tickTimer += dt;
    if (tickTimer >= tickInterval) {
      step();
      tickTimer = 0;
    }
    render();
  }

  function startGame() {
    reset();
    running = true; paused = false; over = false;
    overlay.classList.add('hidden');
    lastTime = performance.now();
    tickTimer = 0;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  function gameOver() {
    over = true; running = false;
    if (score > best) {
      best = score;
      localStorage.setItem(STORAGE_KEY, String(best));
      bestEl.textContent = best;
    }
    ovTitle.textContent = 'GAME OVER';
    ovSub.innerHTML = '점수 ' + score + ' · 길이 ' + snake.length + '<br>다시 도전해보세요';
    startBtn.textContent = 'RETRY';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running || over) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = 'PAUSED';
      ovSub.textContent = '계속하려면 누르세요';
      startBtn.textContent = 'RESUME';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastTime = performance.now();
    }
  }

  function setDir(dx, dy) {
    if (!running || paused || over) return;
    // prevent reversing into itself
    if (dx === -dir.x && dy === -dir.y) return;
    nextDir = {x: dx, y: dy};
  }

  document.addEventListener('keydown', (e) => {
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    switch (e.key) {
      case 'ArrowLeft': setDir(-1, 0); break;
      case 'ArrowRight': setDir(1, 0); break;
      case 'ArrowUp': setDir(0, -1); break;
      case 'ArrowDown': setDir(0, 1); break;
      case ' ': togglePause(); break;
      case 'Enter':
        if (!running || over) startGame();
        else if (paused) togglePause();
        break;
    }
  });

  startBtn.addEventListener('click', () => {
    if (paused && !over) { togglePause(); return; }
    startGame();
  });

  document.getElementById('touch').addEventListener('click', (e) => {
    const act = e.target.getAttribute('data-act');
    if (!act) return;
    switch (act) {
      case 'left': setDir(-1, 0); break;
      case 'right': setDir(1, 0); break;
      case 'up': setDir(0, -1); break;
      case 'down': setDir(0, 1); break;
      case 'pause': togglePause(); break;
    }
  });

  // swipe on canvas
  let touchStart = null;
  board.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });
  board.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 20) { touchStart = null; return; }
    if (ax > ay) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  sizeCanvas();
  reset();
  render();
  window.addEventListener('resize', () => { sizeCanvas(); render(); });
})();
</script>
</body>
</html>
