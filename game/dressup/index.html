<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="네온 스타일 인형 옷입히기 게임. 헤어·상의·하의·신발·소품·배경을 골라 나만의 룩을 완성하세요.">
<meta name="theme-color" content="#0a0a12">
<title>NEON DRESSUP · 네온 드레스업</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@500;700;900&display=swap');
  :root {
    --bg: #0a0a12; --panel: #12121f; --accent: #00f0ff; --accent-2: #ff2d95;
    --text: #e8ecff; --muted: #7a82b8; --line: rgba(0,240,255,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(0,240,255,0.14), transparent 55%),
      radial-gradient(ellipse at 80% 120%, rgba(255,45,149,0.14), transparent 55%),
      var(--bg);
    color: var(--text); font-family: 'Orbitron', sans-serif;
    user-select: none;
  }
  body::after {
    content: ""; position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0) 4px);
    pointer-events: none; z-index: 100; mix-blend-mode: multiply;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 56px 16px 40px; }
  .back { position: fixed; top: 14px; left: 16px; z-index: 200; color: var(--muted); text-decoration: none; font-size: 13px; letter-spacing: 1px; }
  .back:hover { color: var(--accent); }
  .title {
    font-family: 'Press Start 2P', monospace; font-size: clamp(14px, 3.4vw, 22px);
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(0,240,255,0.35); text-align: center; margin-bottom: 6px;
  }
  .subtitle { color: var(--muted); text-align: center; font-size: 12px; letter-spacing: 1px; margin-bottom: 22px; }

  .app { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
  @media (min-width: 820px) { .app { grid-template-columns: 1fr 360px; } }

  .stage {
    padding: 6px; border-radius: 14px;
    background: linear-gradient(145deg, rgba(0,240,255,0.5), rgba(255,45,149,0.5));
    box-shadow: 0 0 40px rgba(0,240,255,0.22), inset 0 0 20px rgba(0,0,0,0.6);
  }
  .stage-inner {
    background: #07070e; border-radius: 9px; padding: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #doll { width: 100%; height: auto; display: block; max-height: 78vh; }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
    box-shadow: 0 0 24px rgba(0,240,255,0.08);
  }
  .cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
  .cat {
    background: transparent; border: 1px solid rgba(122,130,184,0.25);
    border-radius: 8px; color: var(--muted); padding: 9px 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  .cat .ci { font-size: 18px; line-height: 1; }
  .cat.active {
    border-color: var(--accent); color: var(--accent);
    background: rgba(0,240,255,0.08); box-shadow: 0 0 14px rgba(0,240,255,0.25);
  }
  .cat:hover { color: var(--text); }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-bottom: 16px; min-height: 148px; }
  .opt {
    background: rgba(255,255,255,0.03); border: 1.5px solid rgba(122,130,184,0.28);
    border-radius: 10px; padding: 10px 6px; cursor: pointer; transition: all .15s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .opt:hover { border-color: var(--text); }
  .opt.active {
    border-color: var(--accent-2); background: rgba(255,45,149,0.1);
    box-shadow: 0 0 14px rgba(255,45,149,0.3);
  }
  .swatch {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .swatch.none {
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.06) 0 6px, transparent 6px 12px);
    position: relative;
  }
  .swatch.none::after {
    content: "✕"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px;
  }
  .opt .lbl { font-size: 10.5px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
  .opt.active .lbl { color: var(--text); }

  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .act {
    font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 11px;
    color: var(--text); background: rgba(255,255,255,0.04);
    border: 1px solid rgba(122,130,184,0.4); border-radius: 8px;
    padding: 12px 6px; cursor: pointer; letter-spacing: .5px;
    transition: all .15s;
  }
  .act:hover { border-color: var(--accent); color: var(--accent); }
  .act:active { transform: scale(0.96); }
  .act.primary {
    color: #061015; background: linear-gradient(90deg, var(--accent), #6ef0ff);
    border-color: transparent; box-shadow: 0 0 18px rgba(0,240,255,0.4);
  }
  .act.primary:hover { color: #061015; }

  footer { margin-top: 30px; padding-top: 18px; border-top: 1px solid rgba(122,130,184,0.2); font-size: 11px; color: var(--muted); text-align: center; letter-spacing: 1px; }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 480px) {
    .cats { grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .cat { font-size: 9px; padding: 7px 0; }
    .cat .ci { font-size: 16px; }
    .opts { grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); }
    .swatch { width: 28px; height: 28px; }
  }
</style>
</head>

              <path d="M 220 90 L 242 76 L 242 104 L 220 96 Z" fill="#ff2d95"/>
              <ellipse cx="200" cy="92" rx="8" ry="6" fill="#ff2d95"/>
              <path d="M 175 92 Q 200 78 225 92" stroke="#c01c70" stroke-width="1" fill="none" opacity=".8"/>
            </g>
            <g data-opt="necklace" style="display:none">
              <path d="M 175 222 Q 200 242 225 222" stroke="#ffd700" stroke-width="2.4" fill="none"/>
              <path d="M 200 242 L 197 250 L 200 258 L 203 250 Z" fill="#ff2d95" stroke="#ffd700" stroke-width="1"/>
            </g>
          </g>
        </svg>
      </div>
    </div>

    <div class="panel">
      <div class="cats" id="cats"></div>
      <div class="opts" id="opts"></div>
      <div class="actions">
        <button class="act" onclick="randomize()">🎲 랜덤</button>
        <button class="act" onclick="resetOutfit()">↺ 리셋</button>
        <button class="act primary" onclick="saveImage()">💾 저장</button>
      </div>
    </div>
  </div>

  <footer>© 2026 U-SOL · <a href="/game/">게임 목록</a> · <a href="/">메인</a></footer>
</div>

<script>
const CATEGORIES = {
  hair:   { icon: '💇', name: 'HAIR' },
  top:    { icon: '👚', name: 'TOP' },
  bottom: { icon: '👖', name: 'BOT' },
  shoes:  { icon: '👟', name: 'SHOE' },
  acc:    { icon: '🎀', name: 'ACC' },
  bg:     { icon: '🌈', name: 'BG' }
};

const OPTIONS = {
  hair: [
    { id: 'bob',      name: '단발',      swatch: '#3a2418' },
    { id: 'long',     name: '긴머리',    swatch: '#241610' },
    { id: 'ponytail', name: '포니테일',  swatch: '#5a3020' },
    { id: 'twin',     name: '트윈테일',  swatch: '#a03050' },
    { id: 'curly',    name: '곱슬',      swatch: '#e8749c' }
  ],
  top: [
    { id: 'tee-pink', name: '핑크티',    swatch: '#f490a8' },
    { id: 'tee-blue', name: '블루티',    swatch: '#78bfef' },
    { id: 'sweater',  name: '스웨터',    swatch: '#9b7cd6' },
    { id: 'tank',     name: '탱크탑',    swatch: '#ffcc70' },
    { id: 'dress',    name: '드레스',    swatch: '#d066a8' }
  ],
  bottom: [
    { id: 'skirt-pink', name: '핑크치마', swatch: '#f490a8' },
    { id: 'skirt-long', name: '롱스커트', swatch: '#8a5cc0' },
    { id: 'jeans',      name: '청바지',   swatch: '#4a6b9e' },
    { id: 'shorts',     name: '반바지',   swatch: '#3a5670' }
  ],
  shoes: [
    { id: 'sneakers', name: '스니커즈', swatch: '#ffffff' },
    { id: 'boots',    name: '부츠',     swatch: '#141414' },
    { id: 'flats',    name: '플랫',     swatch: '#c02840' },
    { id: 'sandals',  name: '샌들',     swatch: '#a67848' }
  ],
  acc: [
    { id: 'none',     name: '없음',     swatch: null },
    { id: 'hat',      name: '베레모',   swatch: '#d94040' },
    { id: 'glasses',  name: '안경',     swatch: '#7080a0' },
    { id: 'ribbon',   name: '리본',     swatch: '#ff2d95' },
    { id: 'necklace', name: '목걸이',   swatch: '#ffd700' }
  ],
  bg: [
    { id: 'neon',    name: '네온',     swatch: 'linear-gradient(135deg, #3a1758, #6b1a70)' },
    { id: 'sunset',  name: '노을',     swatch: 'linear-gradient(180deg, #ffa060, #e04070)' },
    { id: 'sky',     name: '하늘',     swatch: 'linear-gradient(180deg, #a8e0ff, #5090c8)' },
    { id: 'night',   name: '밤하늘',   swatch: 'linear-gradient(180deg, #080820, #2a1858)' }
  ]
};

const DEFAULTS = {
  hair: 'bob', top: 'tee-pink', bottom: 'skirt-pink',
  shoes: 'sneakers', acc: 'none', bg: 'neon'
};

const state = { ...DEFAULTS };
let activeCat = 'hair';

function saveState() {
  try { localStorage.setItem('usol-dressup', JSON.stringify(state)); } catch {}
}
function loadState() {
  try {
    const raw = localStorage.getItem('usol-dressup');
    if (!raw) return;
    const s = JSON.parse(raw);
    for (const k of Object.keys(DEFAULTS)) {
      if (s[k] && OPTIONS[k].some(o => o.id === s[k])) state[k] = s[k];
    }
  } catch {}
}

function applyOption(cat, opt) {
  if (cat === 'hair') {
    document.querySelectorAll('#layer-hair-back > g, #layer-hair-front > g').forEach(el => {
      el.style.display = el.dataset.opt === opt ? '' : 'none';
    });
  } else {
    const layer = document.getElementById('layer-' + cat);
    if (!layer) return;
    layer.querySelectorAll(':scope > g').forEach(el => {
      el.style.display = el.dataset.opt === opt ? '' : 'none';
    });
  }
  if (cat === 'top') {
    document.getElementById('layer-bottom').style.display = (opt === 'dress') ? 'none' : '';
  }
}

function selectOption(cat, opt) {
  state[cat] = opt;
  applyOption(cat, opt);
  if (cat === 'top' && opt !== 'dress') {
    document.getElementById('layer-bottom').style.display = '';
  }
  saveState();
  renderOpts();
}

function renderCats() {
  const el = document.getElementById('cats');
  el.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([id, c]) => {
    const btn = document.createElement('button');
    btn.className = 'cat' + (id === activeCat ? ' active' : '');
    btn.innerHTML = `<span class="ci">${c.icon}</span><span>${c.name}</span>`;
    btn.onclick = () => { activeCat = id; renderCats(); renderOpts(); };
    el.appendChild(btn);
  });
}

function renderOpts() {
  const el = document.getElementById('opts');
  el.innerHTML = '';
  OPTIONS[activeCat].forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (state[activeCat] === o.id ? ' active' : '');
    const sw = document.createElement('div');
    sw.className = 'swatch' + (o.swatch === null ? ' none' : '');
    if (o.swatch !== null) sw.style.background = o.swatch;
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = o.name;
    btn.appendChild(sw);
    btn.appendChild(lbl);
    btn.onclick = () => selectOption(activeCat, o.id);
    el.appendChild(btn);
  });
}

function applyAll() {
  Object.entries(state).forEach(([cat, opt]) => applyOption(cat, opt));
}

function randomize() {
  Object.keys(OPTIONS).forEach(cat => {
    const pool = OPTIONS[cat];
    const pick = pool[Math.floor(Math.random() * pool.length)];
    state[cat] = pick.id;
    applyOption(cat, pick.id);
  });
  if (state.top !== 'dress') document.getElementById('layer-bottom').style.display = '';
  saveState();
  renderOpts();
}

function resetOutfit() {
  Object.assign(state, DEFAULTS);
  applyAll();
  saveState();
  renderOpts();
}

function saveImage() {
  const svg = document.getElementById('doll');
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const svgData = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 800; canvas.height = 1200;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 800, 1200);
    URL.revokeObjectURL(url);
    canvas.toBlob(b => {
      if (!b) return;
      const durl = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = durl;
      a.download = 'my-dressup-doll.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(durl), 1000);
    }, 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('저장 실패. 다시 시도해 주세요.'); };
  img.src = url;
}

loadState();
applyAll();
renderCats();
renderOpts();
</script>
</body>
</html>
